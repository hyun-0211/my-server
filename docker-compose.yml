version: '3.8'

services:
  # 1. FileBrowser (파일 관리 NAS)
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    ports:
      - "8080:80"
    command: --noauth
    volumes:
      - nas_filebrowser_data:/srv
    restart: always

  # 2. Uptime Kuma (서버 상태/통신 모니터링)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: always

volumes:
  nas_filebrowser_data:
  uptime_kuma_data:
